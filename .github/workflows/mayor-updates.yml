name: Mayor update engine (offline)
on:
  pull_request:
    branches: [main]
    paths:
      - 'data-pipeline/mayor_updates/**'
      - 'data-pipeline/tests/test_*mayor*.py'
      - 'data-pipeline/tests/test_kyoto_operations.py'
      - 'data-pipeline/tests/test_city*.py'
      - 'data-pipeline/p1_patches/**'
      - 'config/kobe_m01_trial.json'
      - 'config/mayor_update_sources.json'
      - 'config/kyoto_additional_pdf_watch.json'
      - 'config/kyoto_p04_p14_trial.json'
      - 'scripts/Export-KyotoWeeklyTask.ps1'
      - '.github/workflows/mayor-updates.yml'
  workflow_dispatch:
jobs:
  windows-handoff:
    runs-on: windows-latest
    timeout-minutes: 5
    strategy:
      matrix:
        handoff_case: [positive, missing_program, changed_program]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate nonsecret synthetic handoff and validate existing restore path
        shell: powershell
        run: |
          $fixture=Join-Path $env:RUNNER_TEMP ('stage2-handoff-'+[guid]::NewGuid().ToString('N'))
          python -B data-pipeline/tests/test_stage2_flow_mayor.py --export-handoff $fixture
          if($LASTEXITCODE -ne 0){throw 'Fixture generation failed'}
          ./scripts/Test-Stage2Handoff.ps1 -FixtureRoot $fixture -Case '${{ matrix.handoff_case }}'
          if('${{ matrix.handoff_case }}' -eq 'positive'){
            ./scripts/Prepare-Stage2LocalRecovery.ps1 -SelfTest
          }
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install HTML parser used by the existing P1 bridge
        run: python -m pip install beautifulsoup4==4.15.0 PyMuPDF==1.28.2
      - name: Test proposals, bounded acquisition and persistent weekly entry
        run: |
          python -B -m unittest discover -s data-pipeline/tests -p 'test_launch_contract_mayor.py' -v
          python -B -m unittest discover -s data-pipeline/tests -p 'test_native_launch_mayor.py' -v
          python -B -m unittest discover -s data-pipeline/tests -p 'test_native_root_mayor.py' -v
          python -B -m unittest discover -s data-pipeline/tests -p 'test_stage2_guard_mayor.py' -v
          python -B -m unittest discover -s data-pipeline/tests -p 'test_stage2_flow_mayor.py' -v
          python -B -m unittest discover -s data-pipeline/tests -p 'test_worker_ipc_mayor.py' -v
          python -B -m unittest discover -s data-pipeline/tests -p 'test_stage2_preparation_mayor.py' -v
          python -B -m unittest discover -s data-pipeline/tests -p 'test_stage2_acceptance_mayor.py' -v
          python -B -m unittest discover -s data-pipeline/tests -p 'test_mayor_updates.py'
          python -B -m unittest discover -s data-pipeline/tests -p 'test_kyoto_operations.py'
          python -B -m unittest discover -s data-pipeline/tests -p 'test_weekly_mayor.py'
          python -B -m unittest discover -s data-pipeline/tests -p 'test_continuous_mayor.py'
          python -B -m unittest discover -s data-pipeline/tests -p 'test_periodic_mayor.py'
          python -B -m unittest discover -s data-pipeline/tests -p 'test_pdf_mayor.py'
      - name: Test explicit city scope without network
        run: |
          python -B -m unittest discover -s data-pipeline/tests -p 'test_city_scope.py' -v
          python -B -m unittest discover -s data-pipeline/tests -p 'test_city_kyoto_wave1.py' -v
      - name: Test saved city replay and persistent dedup
        run: |
          python -B -m unittest discover -s data-pipeline/tests -p 'test_city_replay.py' -v
          python -B -m unittest discover -s data-pipeline/tests -p 'test_city_receipt.py' -v
      - name: Report external P1 integration availability
        run: |
          python -B -m unittest discover -s data-pipeline/tests -p 'test_city_p1_offline.py' -v
          echo '### External P1 integration: NOT VALIDATED' >> "$GITHUB_STEP_SUMMARY"
          echo 'This hosted job has no approved immutable P1 dependency. Its P1 city tests are skipped; an offline CI pass is not integration acceptance. A separate approved private environment must supply the pinned P1 code before merge.' >> "$GITHUB_STEP_SUMMARY"
      - name: Test offline Firewall restore plan without OS changes
        shell: pwsh
        run: ./scripts/Restore-Stage2Firewall.ps1 -SelfTest
      - name: Test independent manual recovery preparation without executing emitted text
        shell: pwsh
        run: ./scripts/Prepare-Stage2LocalRecovery.ps1 -SelfTest
