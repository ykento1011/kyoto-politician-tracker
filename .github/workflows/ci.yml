name: CI Integrity & Build Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - codex/mayor-shared-evidence-ui
  workflow_dispatch:

jobs:
  audit-and-build:
    name: Integrity Audit & Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. 監査実行 (標準ライブラリのみ使用)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Unified Integrity Audit (Fail-Closed)
        run: |
          echo "::group::Running Integrity Audit"
          python data-pipeline/audit_unified_integrity.py
          echo "::endgroup::"

      - name: Test Kyoto speaker and thread repair (offline)
        run: python -m unittest discover -s tests -p "test_kyoto_thread_repair.py"

      - name: Test Kyoto identity and saved operations (offline)
        run: |
          python -B -m unittest discover -s tests -p "test_kyoto_meeting_guard.py"
          python -B -m unittest discover -s tests -p "test_kyoto_operations_contract.py"
          python -B -m unittest discover -s tests -p "test_kyoto_continuation.py"

      - name: Test Kyoto budget data and generator (offline)
        run: python -m unittest discover -s data-pipeline/tests -p "test_mayor_p*_public.py"

      - name: Test member history and Nagoya evidence (offline)
        run: |
          python -B -m unittest discover -s tests -p "test_member_history.py"
          python -B -m unittest discover -s tests -p "test_nagoya_article_review.py"

      - name: Test common council observation cycle (offline)
        run: python -B -m unittest discover -s tests -p "test_common_council_cycle.py"

      # 2. ビルドテスト
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Test Kyoto budget evidence display (offline)
        run: |
          node frontend/tests/test-kyoto-policy-ui.mjs
          node frontend/tests/test-shared-mayor-ui.mjs
          node frontend/tests/test-p01-p02-public.mjs
          node frontend/tests/test-p03-public.mjs
          node frontend/tests/test-p07-public.mjs
          node frontend/tests/test-kobe-m01-public.mjs
          node frontend/tests/test-p05-p09-public.mjs

      - name: Test frontend build
        run: npm --prefix frontend run build

      # 3. E2E Playwright テスト (Desktop + Mobile Safari + Mobile Chrome)
      - name: Install E2E dependencies (Root)
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests
        run: npx playwright test --project="Desktop Chrome" --project="Mobile Chrome (Pixel 7)"
