name: CI Integrity & Build Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  audit-and-build:
    name: Integrity Audit & Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. 監査実行 (標準ライブラリのみ使用)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Unified Integrity Audit (Fail-Closed)
        run: |
          echo "::group::Running Integrity Audit"
          python data-pipeline/audit_unified_integrity.py
          echo "::endgroup::"

      # 2. ビルドテスト
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Test frontend build
        run: npm --prefix frontend run build

      # 3. E2E Playwright テスト (Desktop + Mobile Safari + Mobile Chrome)
      - name: Install E2E dependencies (Root)
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests
        run: npx playwright test --project="Desktop Chrome" --project="Mobile Chrome (Pixel 7)"
