name: CI Integrity & Build Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  audit-and-build:
    name: Integrity Audit & Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. 監査実行 (標準ライブラリのみ使用)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Unified Integrity Audit (Fail-Closed)
        run: |
          echo "::group::Running Integrity Audit"
          python data-pipeline/audit_unified_integrity.py
          echo "::endgroup::"

      # 2. ビルドテスト
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Test frontend build
        run: npm --prefix frontend run build
