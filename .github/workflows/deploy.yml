name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  audit-and-deploy:
    name: Integrity Audit & Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 1. Python環境セットアップ & 全自動インテグリティ監査
      # ------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Unified Integrity Audit (Fail-Closed)
        run: |
          echo "::group::Running Integrity Audit"
          python data-pipeline/audit_unified_integrity.py
          echo "::endgroup::"

      # ------------------------------------------------------------
      # 2. Node.js環境セットアップ & プロダクションビルド
      # ------------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build frontend (Vite / Cloudflare Pages)
        run: npm --prefix frontend run build

      # ------------------------------------------------------------
      # 3. Cloudflare Pages へのデプロイ
      # ------------------------------------------------------------
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=kyoto-politician-tracker --branch=main
