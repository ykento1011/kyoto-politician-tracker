name: P0-OPS Offline Preflight Tests

on:
  pull_request:
    paths:
      - 'data-pipeline/ops_preflight/**'
      - '.github/workflows/p0-ops-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  five-city-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline synthetic positive and negative cases (five cities)
        run: python -B -m unittest discover -s data-pipeline/ops_preflight -p 'test_*.py' -v
