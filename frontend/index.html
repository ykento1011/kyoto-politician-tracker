    <!-- 💡 Google リッチリザルト対応: ProfilePage (Person) 即時評価インラインスクリプト -->
    <script>
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          var speaker = params.get('speaker');
          if (speaker) {
            var cleanName = decodeURIComponent(speaker).trim();
            var cityMatch = window.location.pathname.match(/\/(kyoto|osaka|nagoya|yokohama|kobe)/);
            var city = cityMatch ? cityMatch[1] : 'kyoto';
            var cityNames = { kyoto: '京都市', osaka: '大阪市', nagoya: '名古屋市', yokohama: '横浜市', kobe: '神戸市' };
            var councilName = (cityNames[city] || '市') + '会';

            var jsonLd = {
              "@context": "https://schema.org",
              "@type": "ProfilePage",
              "mainEntity": {
                "@type": "Person",
                "name": cleanName,
                "jobTitle": councilName + "議員",
                "worksFor": {
                  "@type": "GovernmentOrganization",
                  "name": councilName
                },
                "url": window.location.href
              }
            };
            var script = document.createElement('script');
            script.type = 'application/ld+json';
            script.id = 'speaker-jsonld-instant';
            script.text = JSON.stringify(jsonLd);
            document.head.appendChild(script);
          }
        } catch (e) {}
      })();
    </script>
  </head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
